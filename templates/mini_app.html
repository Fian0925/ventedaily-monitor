<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <title>Ventedaily · Dashboard Reseller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='mini-app/dashboard.css', v=8) }}">
    <script src="https://telegram.org/js/telegram-web-app.js?59" defer></script>
    <script src="{{ url_for('static', filename='mini-app/dashboard.js', v=8) }}" defer></script>
</head>
<body>
    <header class="app-nav">
        <div class="nav-inner">
            <a href="#main" class="brand" aria-label="Ventedaily Dashboard">
                <span class="brand-mark" aria-hidden="true">V</span>
                <span>Ventedaily</span>
            </a>
            <span id="mode" class="mode" hidden>Demo</span>

            <nav class="tabs" aria-label="Menu dashboard">
                <button type="button" data-view="stock" aria-controls="stock" aria-current="page"><span class="nav-icon icon-stock" aria-hidden="true"></span>Stok</button>
                <button type="button" data-view="watch" aria-controls="watch"><span class="nav-icon icon-bell" aria-hidden="true"></span>Pantauan<span id="watch-count" class="count" hidden>0</span></button>
                <button type="button" data-view="catalog" aria-controls="catalog"><span class="nav-icon icon-catalog" aria-hidden="true"></span>Katalog<span id="catalog-count" class="count" hidden>0</span></button>
            </nav>
        </div>
    </header>

    <main id="main" class="shell">
        <section id="notice" class="notice" hidden role="status">
            <p id="notice-text"></p>
            <button id="notice-action" type="button" class="button secondary" hidden></button>
        </section>

        <section id="stock" class="view" aria-labelledby="stock-title">
            <div class="view-header">
                <div><h1 id="stock-title">Stok produk</h1><p id="stock-time">Memuat stok…</p></div>
                <button id="refresh" class="button secondary" type="button" hidden>Muat ulang</button>
            </div>

            <div class="filters" role="group" aria-label="Filter stok">
                <label class="field field-search">
                    <span>Cari produk</span>
                    <span class="field-control search-field">
                        <span class="nav-icon icon-search" aria-hidden="true"></span>
                        <input id="query" type="search" placeholder="Nama, warna, atau ukuran" autocomplete="off">
                    </span>
                </label>
                <label class="field">
                    <span>Jenis produk</span>
                    <span class="field-control select-field">
                        <select id="category"><option value="">Semua jenis</option></select>
                    </span>
                </label>
                <label class="field">
                    <span>Status stok</span>
                    <span class="field-control select-field">
                        <select id="status">
                            <option value="">Semua</option>
                            <option value="available">Tersedia</option>
                            <option value="ready">Terbatas</option>
                            <option value="habis">Habis</option>
                        </select>
                    </span>
                </label>
                <details class="extra-filters">
                    <summary>Warna dan ukuran</summary>
                    <div class="extra-fields">
                        <label class="field">
                            <span>Warna</span>
                            <span class="field-control select-field">
                                <select id="color"><option value="">Semua warna</option></select>
                            </span>
                        </label>
                        <label class="field">
                            <span>Ukuran</span>
                            <span class="field-control select-field">
                                <select id="size"><option value="">Semua ukuran</option></select>
                            </span>
                        </label>
                    </div>
                </details>
            </div>

            <div class="result-bar">
                <div class="result-meta">
                    <p id="result-count" role="status"></p>
                    <button id="clear-filters" class="clear-filters" type="button" hidden>Reset filter</button>
                </div>
                <div id="carousel-controls" class="carousel-controls" hidden>
                    <button id="previous" class="button secondary" type="button" aria-label="Halaman sebelumnya" aria-controls="stock-list">Kembali</button>
                    <span id="carousel-position" aria-live="polite"></span>
                    <button id="next" class="button secondary" type="button" aria-label="Halaman berikutnya" aria-controls="stock-list">Lanjut</button>
                </div>
            </div>

            <div id="stock-list" class="carousel" role="region" aria-label="Produk" tabindex="0"></div>
        </section>

        <section id="watch" class="view" aria-labelledby="watch-title" hidden>
            <div class="view-header">
                <div><h1 id="watch-title">Pantauan</h1><p id="watch-description">Notifikasi Telegram dikirim saat varian pantauan kembali tersedia.</p></div>
            </div>
            <div class="list" id="watch-list"></div>
        </section>

        <section id="catalog" class="view" aria-labelledby="catalog-title" hidden>
            <div class="view-header">
                <div><h1 id="catalog-title">Katalog</h1><p>Susun daftar produk untuk dikirim ke WhatsApp.</p></div>
                <button id="make-catalog" class="button primary" type="button" disabled>Buat teks</button>
            </div>
            <div class="list" id="catalog-list"></div>
            <div id="catalog-preview" class="catalog-preview" hidden>
                <label for="catalog-text">Teks untuk WhatsApp</label>
                <p id="catalog-note" class="catalog-note" hidden></p>
                <textarea id="catalog-text" readonly rows="9"></textarea>
                <button id="copy" type="button" class="button primary">Salin teks</button>
            </div>
        </section>
        <div id="product-options" class="product-options" role="group" aria-label="Aksi produk" hidden></div>
        <p id="feedback" class="toast" role="status" aria-live="polite" hidden></p>
    </main>
</body>
</html>
